# ros2_control 控制器配置
# 与 alicia_m_moveit_config 中的配置保持一致
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: position_controllers/GripperActionController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    constraints:
      goal_time: 2.0
      stopped_velocity_tolerance: 0.05
      joint1: {trajectory: 0.20, goal: 0.04}
      joint2: {trajectory: 0.20, goal: 0.04}
      joint3: {trajectory: 0.20, goal: 0.04}
      joint4: {trajectory: 0.20, goal: 0.04}
      joint5: {trajectory: 0.20, goal: 0.04}
      joint6: {trajectory: 0.20, goal: 0.04}

gripper_controller:
  ros__parameters:
    joint: left_finger
    action_monitor_rate: 20.0
    goal_tolerance: 0.01
    max_effort: 5.0
    allow_stalling: true
    stall_velocity_threshold: 0.001
    stall_timeout: 1.0
